<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ausgaben</title>
<meta name="theme-color" content="#1f6f5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ausgaben">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --text:#1d1d1f; --muted:#6e6e73; --line:#e6e4df;
  --accent:#1f6f5c; --accent-soft:#e3f0ec; --danger:#c0392b; --chip:#efede8;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121212; --card:#1c1c1e; --text:#f2f2f2; --muted:#9a9a9f; --line:#2c2c2e;
    --accent:#4fbf9f; --accent-soft:#1d3530; --danger:#ff6b5b; --chip:#2a2a2c; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,'Segoe UI',Roboto,sans-serif;font-size:16px}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(76px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px;font-weight:700}
h2{font-size:15px;margin:22px 0 10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.status{font-size:13px;color:var(--muted);margin-bottom:10px;min-height:18px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.status button{background:none;border:0;color:var(--accent);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:4px 0}
.status.err #stxt{color:var(--danger)}
.status.err{color:var(--danger)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;max-width:190px;background:none;border:0;color:var(--muted);font:inherit;font-size:13px;font-weight:600;padding:12px 4px 14px;cursor:pointer}
nav button.on{color:var(--accent)}
.amount-row{display:flex;align-items:center;gap:8px}
.amount{flex:1;font-size:40px;font-weight:700;border:0;background:transparent;color:var(--text);width:100%;outline:none;font-family:inherit}
.amount::placeholder{color:var(--line)}
.eur{font-size:32px;font-weight:600;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media (min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}}
.cat{display:flex;align-items:center;gap:6px;padding:10px 8px;min-height:52px;line-height:1.2;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:13px;font-weight:500;cursor:pointer;text-align:left}
.cat.on{border-color:var(--accent);background:var(--accent-soft)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{padding:8px 12px;border-radius:999px;background:var(--chip);border:1px solid transparent;color:var(--text);font:inherit;font-size:14px;cursor:pointer}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
input[type=text],input[type=date],input[type=month],input[type=number],select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:16px}
label.l{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{display:block;width:100%;padding:15px;border-radius:12px;border:0;background:var(--accent);color:#fff;font:inherit;font-size:16px;font-weight:600;cursor:pointer;margin-top:14px}
.btn:disabled{opacity:.4;cursor:default}
.btn.sec{background:var(--chip);color:var(--text)}
.btn.small{display:inline-block;width:auto;padding:9px 14px;font-size:14px;margin-top:0}
.btn.danger{background:none;color:var(--danger);border:1px solid var(--danger)}
.quick{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:4px}
.quick .chip{white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.day{font-size:13px;color:var(--muted);font-weight:600;margin:16px 4px 6px;display:flex;justify-content:space-between}
.item{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;cursor:pointer}
.item .t{flex:1;min-width:0}
.item .t b{font-weight:500;font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t span{font-size:13px;color:var(--muted)}
.item .a{font-weight:600;font-variant-numeric:tabular-nums}
.monthnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.monthnav button{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;width:42px;height:42px;font-size:18px;cursor:pointer}
.monthnav b{font-size:18px}
.big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.kpis div{background:var(--bg);border-radius:10px;padding:10px}
.kpis small{display:block;color:var(--muted);font-size:12px}
.kpis b{font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:4px}
.catline{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.catline:last-child{border-bottom:0}
.catline .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.catline .h span{display:flex;align-items:center;gap:8px;font-weight:500}
.catline .h b{font-variant-numeric:tabular-nums}
.subs{margin:8px 0 0 18px;font-size:14px;color:var(--muted)}
.subs div{display:flex;justify-content:space-between;padding:3px 0}
.chart{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer}
.chart .c i{display:block;width:100%;max-width:46px;border-radius:6px 6px 0 0;background:var(--accent);opacity:.55}
.chart .c.on i{opacity:1}
.chart .c i.fx{background:var(--muted);opacity:.35;border-radius:0}
.chart .c small{font-size:11px;color:var(--muted);margin-top:6px}
.chart .c em{font-style:normal;font-size:11px;font-weight:600;margin-bottom:4px;font-variant-numeric:tabular-nums}
.debt .h{display:flex;justify-content:space-between;align-items:baseline}
.debt .h b{font-size:17px}
.muted{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:24px 8px;font-size:15px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:30}
.overlay.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:20px}}
.sheet h3{margin:0 0 6px;font-size:18px}
.hidden{display:none!important}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
</style>
</head>
<body>
<div class="wrap">
  <div class="status" id="status"><span id="stxt"></span><button id="opensettings">Einstellungen</button></div>

  <!-- ERFASSEN -->
  <section id="v-add">
    <h1>Neue Ausgabe</h1>
    <div class="quick" id="quick"></div>
    <div class="card">
      <div class="amount-row">
        <input id="amt" class="amount" inputmode="decimal" placeholder="0,00" autocomplete="off">
        <span class="eur">€</span>
      </div>
    </div>
    <div class="grid" id="cats"></div>
    <div class="chips" id="subs"></div>
    <div id="debtpick" class="hidden">
      <label class="l">Welche Schulden?</label>
      <select id="debtsel"></select>
    </div>
    <div class="row">
      <div><label class="l">Notiz (optional)</label><input type="text" id="note" placeholder="z. B. Rewe, Asiamarkt" autocomplete="off"></div>
      <div style="flex:0 0 160px"><label class="l">Datum</label><input type="date" id="date"></div>
    </div>
    <button class="btn" id="save" disabled>Speichern</button>
  </section>

  <!-- VERLAUF -->
  <section id="v-list" class="hidden">
    <h1>Verlauf</h1>
    <input type="text" id="search" placeholder="Suchen (Notiz, Kategorie)" autocomplete="off">
    <div id="list"></div>
  </section>

  <!-- AUSWERTUNG -->
  <section id="v-stats" class="hidden">
    <h1>Auswertung</h1>
    <div class="monthnav"><button id="mprev">‹</button><b id="mlabel"></b><button id="mnext">›</button></div>
    <div class="card">
      <div class="sub">Gesamt im Monat</div>
      <div class="big" id="mtotal"></div>
      <div class="kpis">
        <div><small>Variabel</small><b id="kvar"></b></div>
        <div><small>Fixkosten</small><b id="kfix"></b></div>
        <div><small>Essen &amp; Trinken</small><b id="kfood"></b></div>
      </div>
      <div class="sub" id="kcompare" style="margin-top:10px"></div>
    </div>
    <div class="card">
      <div class="sub">Letzte 6 Monate</div>
      <div class="chart" id="chart"></div>
      <div class="legend"><span><i style="background:var(--accent)"></i>Variabel</span><span><i style="background:var(--muted);opacity:.5"></i>Fixkosten</span></div>
    </div>
    <h2>Nach Kategorie</h2>
    <div class="card" id="bycat"></div>
    <button class="btn sec" id="export">Alle Daten als CSV kopieren</button>
  </section>

  <!-- FIX & SCHULDEN -->
  <section id="v-fix" class="hidden">
    <h1>Fixkosten &amp; Schulden</h1>
    <h2>Schulden</h2>
    <div id="debts"></div>
    <button class="btn sec" id="adddebt">Schulden hinzufügen</button>
    <h2>Monatliche Fixkosten</h2>
    <div class="sub" style="margin:-4px 4px 10px">Werden jeden Monat automatisch mitgezählt, du musst sie nicht eintragen.</div>
    <div id="fixed"></div>
    <button class="btn sec" id="addfix">Fixkosten hinzufügen</button>
  </section>
</div>

<nav>
  <button data-v="add" class="on">Erfassen</button>
  <button data-v="list">Verlauf</button>
  <button data-v="stats">Auswertung</button>
  <button data-v="fix">Fix &amp; Schulden</button>
</nav>

<div class="overlay" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
